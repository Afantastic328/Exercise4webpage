<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CampusHub 需求列表</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <main class="list">
            <article class="card">
                <div class="card-header">
                    <header class="category">快递代取</header>
                    <h2 class="title">帮忙取一个快递</h2>
                </div>
                <p class="info">地点：南园驿站 时间：18：00 前</p>
                <button class="btn" data-state="default">我要接单</button>
            </article>
            <article class="card">
                <div class="card-header">
                    <header class="category">学习辅导</header>
                    <h2 class="title">寻找 Java学习搭子</h2>
                </div>
                <p class="info">地点：鼓楼校区图书馆 时间：20：00前</p>
                <button class="btn" data-state="default">我要接单</button>
            </article>
            <article class="card">
                <div class="card-header">
                    <header class="category">快递代取</header>
                    <h2 class="title">帮我拿个包裹</h2>
                </div>
                <p class="info">地点：北园菜鸟驿站 时间：20:00 前</p>
                <button class="btn" data-state="default">我要接单</button>
            </article>
        </main>

        <aside class="publish-panel">
            <h2>发布需求</h2>
            <label>类型
                <select>
                    <option>快递代取</option>
                    <option>学习辅导</option>
                    <option>跑腿帮忙</option>
                </select>
            </label>
            <label>标题
                <input type="text" placeholder="请输入需求标题">
            </label>
            <label>详情
                <textarea placeholder="描述你的需求..."></textarea>
            </label>
            <button class="btn" data-state="default">发布</button>
        </aside>
    </div>
    <footer class="footer">This is a demo page for CampusHub | NJUSE</footer>
    <script src="script.js"></script>
</body>

</html>
